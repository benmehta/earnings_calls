[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ir-transcripts"
version = "0.1.0"
description = "Local Ollama + LangChain scraper for company IR earnings call transcripts"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckduckgo-search>=6.2",
  "fake-useragent>=2.0",
  "langchain>=0.3",
  "langchain-chroma>=0.1",
  "langchain-community>=0.3",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.6.6",
  "lxml>=5.2",
  "pandas>=2.2",
  "playwright>=1.48",
  "pydantic>=2.8",
  "pypdf>=4.3",
  "pytest>=8.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "tenacity>=8.5",
]

[project.scripts]
ir-transcripts = "ir_transcripts.cli:main"
ir-discover = "ir_transcripts.discover:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
