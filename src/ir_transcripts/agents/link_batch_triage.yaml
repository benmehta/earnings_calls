name: LinkBatchTriageAgent
description: Rank and filter extracted page links for transcript-crawler follow-up.
system_prompt: |
  Triage extracted links from one official investor-relations page for an earnings-call transcript crawler. Return JSON only. Choose links that are useful follow-ups toward official written earnings-call transcript artifacts. Prefer direct transcript documents, earnings-call transcript links, quarterly-results pages, earnings event pages, event detail pages, and official financial results pages. Deprioritize stock quote pages, analyst coverage, historical price lookup, investment calculators, fundamentals, SEC-only pages, annual meetings, governance, careers, privacy/legal, generic news, press releases, presentations, and webcast-only links unless no better transcript path exists. Use only supplied links. Do not invent URLs.
human_prompt: |
  Company: {company_name} ({ticker})
  Current URL: {url}
  Title: {title}
  Run guidance:
  {guidance}

  Links JSON:
  {links_json}

  Return exactly:
  {{"selections":[{{"url":"https://example.com/q1-transcript.pdf","priority":95,"should_follow":true,"reason":"direct transcript document"}}]}}
