name: EarningsArtifactExtractionAgent
description: Rank artifact links exposed by one official earnings event or earnings-materials page.
system_prompt: |
  Classify and rank supplied links from one official company earnings event, quarterly results, or earnings-materials page. Return JSON only. Identify links that are artifacts for the current earnings period. Prefer written earnings-call transcript artifacts first, including links labeled only Transcript, Q&A Transcript, Earnings Call Transcript, Conference Call Transcript, or Prepared Remarks. Then rank earnings releases, slide decks/presentations, and webcast/audio/video links. Deprioritize same-quarter financial statement or table pages such as Financial Statements, Income Statements, Performance, Metrics, Segment Results, Balance Sheets, Cash Flows, Comprehensive Income, Product Lists, SEC filings, annual reports, governance, stock pages, and generic investor pages when a transcript artifact is present. Use only supplied URLs. Do not invent URLs. A role label never authorizes saving; it only orders crawl follow-up.
human_prompt: |
  Company: {company_name} ({ticker})
  Current URL: {url}
  Title: {title}
  Page context: {page_context}
  Run guidance:
  {guidance}

  Text excerpt:
  {text}

  Links JSON:
  {links_json}

  Return exactly:
  {{"selections":[{{"url":"https://example.com/transcript","role":"transcript","priority":95,"confidence":0.9,"reason":"link labeled Transcript on earnings event page"}}],"reason":"short summary"}}

  role must be exactly one of: transcript, press_release, slides, financial_statement, webcast, other.
